<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .container{
            width: 100%;
            min-height: 100vh;
            background-color: greenyellow;
        }
        .grid{
            height: 100vh;
            display: grid;
            grid-template-columns: minmax(400px, 1fr) 1fr ;
            row-gap: 5px;
            column-gap: 5px;
        }
        .item{
            background-color: red;
        }
        .item1{
            grid-column-start: 1;
            grid-column-end: span 2;
        }
        .item4{
            position:relative;
            bottom: 0;
            grid-column-start: 1;
            grid-column-end: 3;
        }
        #SH{
            margin-top: 1000px;
            background-color: red;
        }
        .box{
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle{
            width: 100px;
            height: 100px;
            background-color: cadetblue;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            animation: animate;
            animation-duration: 3s;
            animation-direction: alternate;
            animation-iteration-count: infinite;
            animation-delay: 5s;
        }
        @keyframes animate {
            from{}
            to{
                background-color: red;
                border-radius: 0;
                color:white;
            }
            
        }

    </style>
</head>
<body>
    <div class="container">

        <!-- <div class="grid">
            <div class="item item1">item</div>
            <div class="item">item</div>
            <div class="item">item</div>
            <div class="item item4">item 4</div>
        </div> -->

        <div class="nav">
            <ul>
                <li><a href="#MH">main heading</a></li>
                <li><a href="#SH">Sub heading</a></li>
            </ul>
            <h1 style="margin-top: 1000px;" id="MH"> main heading</h1>
            <h2 id="SH">sub heading</h2>
            <hr>

            <div class="box">
                <div class="circle">Circle</div>
            </div>
        </div>
    </div>

    
</body>
</html>
